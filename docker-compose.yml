services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: specsheet
      POSTGRES_USER: specsheet
      POSTGRES_PASSWORD: specsheet_dev

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specsheet -d specsheet"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      DB_NAME: specsheet
      DB_USER: specsheet
      DB_PASSWORD: specsheet_dev
      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: